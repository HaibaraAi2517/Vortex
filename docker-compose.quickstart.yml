name: ${COMPOSE_PROJECT_NAME:-vortex-quickstart}

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - quickstart-etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-07-04T14-25-45Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - quickstart-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - quickstart-milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - quickstart-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 3

  vortex-data-init:
    image: redis:7.2-alpine
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p /var/lib/vortex/wal /var/lib/vortex/persistence &&
        chown -R 10001:10001 /var/lib/vortex
    volumes:
      - quickstart-vortex-data:/var/lib/vortex
    restart: "no"

  vortex:
    image: ${VORTEX_IMAGE:-ghcr.io/haibaraai2517/vortex:0.2.0}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      VORTEX_STORAGE_L2_MILVUS_COLLECTION: vortex_memory_quickstart
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: vortex
      MINIO_KEY_PREFIX: quickstart/
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      VORTEX_EXECUTION_ID_BACKEND: REDIS
      VORTEX_SECURITY_ENABLED: "true"
      VORTEX_SECURITY_BEARER_TOKEN: ${VORTEX_SECURITY_BEARER_TOKEN:?Set VORTEX_SECURITY_BEARER_TOKEN}
      VORTEX_SECURITY_NAMESPACE_PATTERNS: ${VORTEX_SECURITY_NAMESPACE_PATTERNS:-quickstart-*}
      BGE_MODEL_PATH: /app/models/bge-small-zh
      VORTEX_SCHEDULER_ENABLED: "false"
      VORTEX_RELEASE_VERSION: ${VORTEX_RELEASE_VERSION:-0.2.0}
      VORTEX_WAL_DIR: /var/lib/vortex/wal
      VORTEX_PERSISTENCE_DLQ_PATH: /var/lib/vortex/persistence/dlq.jsonl
      VORTEX_PERSISTENCE_PROCESSED_KEYS_PATH: /var/lib/vortex/persistence/processed-keys.txt
      VORTEX_KERNEL_PAGING_PAGE_TABLE_KEY: ${VORTEX_KERNEL_PAGING_PAGE_TABLE_KEY:-system/semantic-page-table-v2.bin}
    ports:
      - "127.0.0.1:${VORTEX_HTTP_PORT:-8080}:8080"
    volumes:
      - quickstart-vortex-data:/var/lib/vortex
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 36
    depends_on:
      vortex-data-init:
        condition: service_completed_successfully
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  quickstart-etcd-data:
  quickstart-milvus-data:
  quickstart-minio-data:
  quickstart-redis-data:
  quickstart-vortex-data:
