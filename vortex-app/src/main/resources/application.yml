server:
  port: 8080
  address: ${SERVER_ADDRESS:127.0.0.1}
  max-http-request-header-size: 32KB

spring:
  application:
    name: vortex
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ---- Vortex storage config ----
vortex:
  release:
    version: ${VORTEX_RELEASE_VERSION:0.1.1}
  security:
    enabled: ${VORTEX_SECURITY_ENABLED:false}
    bearer-token: ${VORTEX_SECURITY_BEARER_TOKEN:}
    namespace-patterns: ${VORTEX_SECURITY_NAMESPACE_PATTERNS:}
    max-request-bytes: ${VORTEX_SECURITY_MAX_REQUEST_BYTES:1048576}
    requests-per-minute: ${VORTEX_SECURITY_REQUESTS_PER_MINUTE:600}
    audit-enabled: ${VORTEX_SECURITY_AUDIT_ENABLED:true}
  storage:
    l1:
      max-tokens: 8192
    l2:
      milvus:
        host: ${MILVUS_HOST:localhost}
        port: ${MILVUS_PORT:19530}
        # Set to true ONCE when changing embedding-dim (e.g. 512→1024 migration).
        # Drops and recreates the Milvus collection. Reset to false after first startup.
        drop-collection-on-startup: ${MILVUS_DROP_COLLECTION:false}
        drop-collection-confirm-token: ${MILVUS_DROP_CONFIRM_TOKEN:}
        load-wait-timeout: ${MILVUS_LOAD_WAIT_TIMEOUT:180s}
        load-wait-interval: ${MILVUS_LOAD_WAIT_INTERVAL:1s}
      # Safe local default is 512 (BGE-Small). Switch to 1024 only when
      # cloud embedding is enabled and the Milvus collection has been migrated.
      embedding-dim: ${VORTEX_L2_EMBEDDING_DIM:512}
    l3:
      minio:
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        access-key: ${MINIO_ACCESS_KEY:}
        secret-key: ${MINIO_SECRET_KEY:}
        bucket: ${MINIO_BUCKET:vortex}
        key-prefix: ${MINIO_KEY_PREFIX:}

  runtime:
    execution-id:
      backend: ${VORTEX_EXECUTION_ID_BACKEND:MEMORY}
      ttl: ${VORTEX_EXECUTION_ID_TTL:24h}
      key-prefix: ${VORTEX_EXECUTION_ID_KEY_PREFIX:vortex:execution-id:}

  # ---- Kernel config ----
  kernel:
    slo:
      min-eviction-log-coverage: ${VORTEX_SLO_MIN_EVICTION_LOG_COVERAGE:1.0}
      max-eviction-regret-rate: ${VORTEX_SLO_MAX_EVICTION_REGRET_RATE:0.05}
      max-namespace-isolation-violations: ${VORTEX_SLO_MAX_NAMESPACE_ISOLATION_VIOLATIONS:0}
      min-checkpoint-recovery-success-rate: ${VORTEX_SLO_MIN_CHECKPOINT_RECOVERY_SUCCESS_RATE:${VORTEX_SLO_MIN_RECOVERY_SUCCESS_RATE:1.0}}
      min-persistence-success-rate: ${VORTEX_SLO_MIN_PERSISTENCE_SUCCESS_RATE:1.0}
      max-store-latency-p99-ms: ${VORTEX_SLO_MAX_STORE_LATENCY_P99_MS:10.0}
      max-recall-latency-p99-ms: ${VORTEX_SLO_MAX_RECALL_LATENCY_P99_MS:10.0}
      min-learning-samples-for-health: ${VORTEX_SLO_MIN_LEARNING_SAMPLES_FOR_HEALTH:1}
      min-shadow-relative-lift: ${VORTEX_SLO_MIN_SHADOW_RELATIVE_LIFT:-1.0}
      min-baseline-relative-lift: ${VORTEX_SLO_MIN_BASELINE_RELATIVE_LIFT:0.20}
      min-baseline-sustained-ratio: ${VORTEX_SLO_MIN_BASELINE_SUSTAINED_RATIO:0.90}
    eviction:
      alpha: 0.3
      beta: 0.5
      gamma: 0.2
      threshold: 0.85
      regret-window-ms: ${VORTEX_EVICTION_REGRET_WINDOW_MS:3600000}
    learning:
      rate: ${VORTEX_LEARNING_RATE:0.08}
      min-samples-before-promotion: ${VORTEX_MIN_SAMPLES_BEFORE_PROMOTION:20}
      shadow-persistence-path: ${VORTEX_SHADOW_PERSISTENCE_PATH:${java.io.tmpdir}/vortex-hmc-shadow-eval.json}
    persistence:
      dlq:
        path: ${VORTEX_PERSISTENCE_DLQ_PATH:${java.io.tmpdir}/vortex-hmc-dlq.jsonl}
        max-attempts: ${VORTEX_PERSISTENCE_DLQ_MAX_ATTEMPTS:5}
      processed-keys:
        path: ${VORTEX_PERSISTENCE_PROCESSED_KEYS_PATH:${java.io.tmpdir}/vortex-hmc-processed-keys.txt}
        max-entries: ${VORTEX_PERSISTENCE_PROCESSED_KEYS_MAX_ENTRIES:10000}
      replay-on-startup: ${VORTEX_PERSISTENCE_REPLAY_ON_STARTUP:true}
    memory-pipeline:
      max-workers: ${VORTEX_MEMORY_PIPELINE_MAX_WORKERS:4}
      max-statuses: ${VORTEX_MEMORY_PIPELINE_MAX_STATUSES:2048}
      queue-capacity: ${VORTEX_MEMORY_PIPELINE_QUEUE_CAPACITY:256}
      extraction-max-units: ${VORTEX_MEMORY_PIPELINE_EXTRACTION_MAX_UNITS:12}
      summary-max-chars: ${VORTEX_MEMORY_PIPELINE_SUMMARY_MAX_CHARS:1200}
    pin:
      cleanup-interval-ms: ${VORTEX_PIN_CLEANUP_INTERVAL_MS:30000}
    recall:
      keyword-candidate-pool-limit: ${VORTEX_RECALL_KEYWORD_CANDIDATE_POOL_LIMIT:256}
      cross-encoder-candidate-pool-limit: ${VORTEX_RECALL_CROSS_ENCODER_CANDIDATE_POOL_LIMIT:40}
      cross-encoder:
        enabled: ${VORTEX_RECALL_CROSS_ENCODER_ENABLED:false}
        model-path: ${VORTEX_RECALL_CROSS_ENCODER_MODEL_PATH:models/ms-marco-MiniLM-L6-v2-c5ee24cb}
        model: ${VORTEX_RECALL_CROSS_ENCODER_MODEL:cross-encoder/ms-marco-MiniLM-L6-v2}
        version: ${VORTEX_RECALL_CROSS_ENCODER_VERSION:c5ee24cb16019beea0893ab7796b1df96625c6b8}
        expected-model-sha256: ${VORTEX_RECALL_CROSS_ENCODER_MODEL_SHA256:c80a8b34256ea453093d612e3ac48d3d965a0c0a48c7906709af8b8e28461bf9}
        expected-tokenizer-sha256: ${VORTEX_RECALL_CROSS_ENCODER_TOKENIZER_SHA256:d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66}
        batch-size: ${VORTEX_RECALL_CROSS_ENCODER_BATCH_SIZE:16}
        max-sequence-length: ${VORTEX_RECALL_CROSS_ENCODER_MAX_SEQUENCE_LENGTH:512}
        intra-op-threads: ${VORTEX_RECALL_CROSS_ENCODER_INTRA_OP_THREADS:8}
        timeout-ms: ${VORTEX_RECALL_CROSS_ENCODER_TIMEOUT_MS:5000}
    splitter:
      max-tokens-per-chunk: 512
    snapshot:
      wal:
        dir: ${VORTEX_WAL_DIR:${java.io.tmpdir}/vortex-wal}
      checkpoint:
        format: kryo
        compression: gzip
        max-deltas-before-full: 10
        rotation:
          max-per-task: 20
          max-age-days: 7
          max-hourly-snapshots: 48
      scheduler:
        enabled: ${VORTEX_SCHEDULER_ENABLED:true}
        max-actions-between: 50
        max-millis-between: 60000
        initial-delay-ms: 30000
        fixed-delay-ms: 10000
      branch:
        max-branches-per-task: 10
    embedding:
      bge:
        # Local directory containing model.onnx and tokenizer.json
        # Download from: https://hf-mirror.com/BAAI/bge-small-zh-v1.5
        model-path: ${BGE_MODEL_PATH:models/bge-small-zh}
      cloud:
        # DeepSeek embedding API — set DEEPSEEK_API_KEY env var
        enabled: ${CLOUD_EMBEDDING_ENABLED:false}
        api-key: ${DEEPSEEK_API_KEY:}
        provider: deepseek
    generation:
      enabled: ${VORTEX_GENERATION_ENABLED:false}
      base-url: ${VORTEX_GENERATION_BASE_URL:https://api.openai.com/v1}
      api-key: ${VORTEX_GENERATION_API_KEY:}
      model: ${VORTEX_GENERATION_MODEL:}
      temperature: ${VORTEX_GENERATION_TEMPERATURE:0}
      max-tokens: ${VORTEX_GENERATION_MAX_TOKENS:512}
      timeout: ${VORTEX_GENERATION_TIMEOUT:30s}
      prompt:
        max-tokens: ${VORTEX_GENERATION_PROMPT_MAX_TOKENS:2048}
    paging:
      enabled: ${VORTEX_PAGING_ENABLED:true}
      page-size: 10
      prefetch:
        dag-topology:
          enabled: true
          max-depth: 2
          max-pages: 3
        semantic-neighborhood:
          enabled: true
          max-pages: 3
          centroid-similarity-threshold: 0.7
        branch-speculative:
          enabled: true
          max-pages-per-branch: 1
      eviction:
        recency-weight: 0.25
        similarity-weight: 0.25
        dag-distance-weight: 0.25
        semantic-distance-weight: 0.25
      initial-build:
        max-fragments: 1000
  eval:
    dataset-location: ${VORTEX_EVAL_DATASET_LOCATION:classpath:llm-memory-eval-set.json}
    modes: ${VORTEX_EVAL_MODES:BASELINE_NO_MEMORY,VORTEX_VECTOR_ONLY,VORTEX_MEMORY,VORTEX_RECOVERED_MEMORY}
    run-on-startup: ${VORTEX_EVAL_RUN_ON_STARTUP:false}
    fail-on-startup-error: ${VORTEX_EVAL_FAIL_ON_STARTUP_ERROR:true}
    write-report: ${VORTEX_EVAL_WRITE_REPORT:true}
    report-output-dir: ${VORTEX_EVAL_REPORT_OUTPUT_DIR:ops/eval-reports}
    recall-top-k: ${VORTEX_EVAL_RECALL_TOP_K:5}
    recall-token-budget: ${VORTEX_EVAL_RECALL_TOKEN_BUDGET:1024}
    hardware-description: ${VORTEX_EVAL_HARDWARE_DESCRIPTION:}
    gpu-description: ${VORTEX_EVAL_GPU_DESCRIPTION:}
    max-prompt-tokens: ${VORTEX_EVAL_MAX_PROMPT_TOKENS:2048}
    feedback-enabled: ${VORTEX_EVAL_FEEDBACK_ENABLED:true}
    learning-scenario: ${VORTEX_EVAL_LEARNING_SCENARIO:CHAT}
    recovery-poll-timeout: ${VORTEX_EVAL_RECOVERY_POLL_TIMEOUT:10s}
    recovery-poll-interval: ${VORTEX_EVAL_RECOVERY_POLL_INTERVAL:250ms}
    async-pipeline-benchmark-fragments: ${VORTEX_EVAL_ASYNC_PIPELINE_BENCHMARK_FRAGMENTS:24}
    async-pipeline-benchmark-warmup-fragments: ${VORTEX_EVAL_ASYNC_PIPELINE_BENCHMARK_WARMUP_FRAGMENTS:3}
    async-pipeline-benchmark-async-parallelism: ${VORTEX_EVAL_ASYNC_PIPELINE_BENCHMARK_ASYNC_PARALLELISM:4}
    admission-benchmark-parallelism-levels: ${VORTEX_EVAL_ADMISSION_BENCHMARK_PARALLELISM_LEVELS:1,2,4,8}
    admission-benchmark-operations-per-thread: ${VORTEX_EVAL_ADMISSION_BENCHMARK_OPERATIONS_PER_THREAD:100}
    admission-benchmark-warmup-operations-per-thread: ${VORTEX_EVAL_ADMISSION_BENCHMARK_WARMUP_OPERATIONS_PER_THREAD:10}
    admission-benchmark-token-count: ${VORTEX_EVAL_ADMISSION_BENCHMARK_TOKEN_COUNT:1}
    admission-benchmark-timeout: ${VORTEX_EVAL_ADMISSION_BENCHMARK_TIMEOUT:30s}
    reclaim-benchmark-singleton-parallelism-levels: ${VORTEX_EVAL_RECLAIM_BENCHMARK_SINGLETON_PARALLELISM_LEVELS:1,8}
    reclaim-benchmark-singleton-operations-per-thread: ${VORTEX_EVAL_RECLAIM_BENCHMARK_SINGLETON_OPERATIONS_PER_THREAD:8}
    reclaim-benchmark-warmup-operations-per-thread: ${VORTEX_EVAL_RECLAIM_BENCHMARK_WARMUP_OPERATIONS_PER_THREAD:1}
    reclaim-benchmark-reasoning-chain-sizes: ${VORTEX_EVAL_RECLAIM_BENCHMARK_REASONING_CHAIN_SIZES:20,50}
    reclaim-benchmark-chain-operations-per-thread: ${VORTEX_EVAL_RECLAIM_BENCHMARK_CHAIN_OPERATIONS_PER_THREAD:1}
    reclaim-benchmark-resident-fragments: ${VORTEX_EVAL_RECLAIM_BENCHMARK_RESIDENT_FRAGMENTS:512}
    reclaim-benchmark-embedding-dimensions: ${VORTEX_EVAL_RECLAIM_BENCHMARK_EMBEDDING_DIMENSIONS:512}
    reclaim-benchmark-namespace-count: ${VORTEX_EVAL_RECLAIM_BENCHMARK_NAMESPACE_COUNT:4}
    reclaim-benchmark-timeout: ${VORTEX_EVAL_RECLAIM_BENCHMARK_TIMEOUT:60s}
    eviction-filler-fragments: ${VORTEX_EVAL_EVICTION_FILLER_FRAGMENTS:6}
    eviction-filler-tokens: ${VORTEX_EVAL_EVICTION_FILLER_TOKENS:0}
    eviction-filler-importance: ${VORTEX_EVAL_EVICTION_FILLER_IMPORTANCE:0.95}
    learning:
      profile-id: ${VORTEX_LEARNING_EVAL_PROFILE_ID:learning-v1-agent-feedback-audit}
      dataset-location: ${VORTEX_LEARNING_EVAL_DATASET_LOCATION:classpath:llm-memory-eval-set-learning-v1-agent-feedback.json}
      dataset-version: ${VORTEX_LEARNING_EVAL_DATASET_VERSION:learning-v1-agent-feedback}
      write-report: ${VORTEX_LEARNING_EVAL_WRITE_REPORT:true}
      report-output-dir: ${VORTEX_LEARNING_EVAL_REPORT_OUTPUT_DIR:ops/eval-reports}
      default-top-k: ${VORTEX_LEARNING_EVAL_TOP_K:4}
      default-token-budget: ${VORTEX_LEARNING_EVAL_TOKEN_BUDGET:1024}
      default-memory-scenario: ${VORTEX_LEARNING_EVAL_MEMORY_SCENARIO:CHAT}
      min-scenario-count: ${VORTEX_LEARNING_EVAL_MIN_SCENARIO_COUNT:5}
      min-feedback-sample-count: ${VORTEX_LEARNING_EVAL_MIN_FEEDBACK_SAMPLE_COUNT:30}
      min-probe-all-relevant-hit-rate: ${VORTEX_LEARNING_EVAL_MIN_PROBE_ALL_RELEVANT_HIT_RATE:0.90}
      min-probe-average-ndcg: ${VORTEX_LEARNING_EVAL_MIN_PROBE_AVERAGE_NDCG:0.90}
      min-rank-improved-scenario-count: ${VORTEX_LEARNING_EVAL_MIN_RANK_IMPROVED_SCENARIO_COUNT:0}
      min-ndcg-improved-scenario-count: ${VORTEX_LEARNING_EVAL_MIN_NDCG_IMPROVED_SCENARIO_COUNT:0}

logging:
  level:
    com.vortex: DEBUG
