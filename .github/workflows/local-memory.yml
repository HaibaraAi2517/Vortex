name: Local Memory

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  local-memory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify all pinned test models
        run: python ops/download-model.py --all
      - name: Verify Java modules and local HTTP API
        run: mvn -B verify
      - name: Install Python and official MCP SDK
        run: python -m pip install "./sdk/python[mcp]" build
      - name: Verify Python and MCP protocol
        run: python -m unittest discover -s sdk/python/tests -v
      - name: Verify Spring AI automatic recall and fact lifecycle
        run: mvn -B -f examples/spring-ai-integration/pom.xml test
      - name: Real model, full corpus, crash restart and MCP smoke
        run: python ops/verify-local-memory.py --mcp
      - name: Build Python distribution
        run: python -m build sdk/python
      - name: Build local trial bundle
        run: python ops/package-local.py
      - name: Verify the Linux launcher and extracted SDK
        if: runner.os == 'Linux'
        run: python ops/verify-local-memory.py --bundle target/vortex-local-alpha.zip --distractors 0 --mcp --output target/local-bundle-smoke.json
      - name: Build Windows x64 bundle and matching Temurin source
        if: runner.os == 'Windows'
        run: python ops/package-windows-runtime.py
      - name: Verify the Windows launcher with only its bundled Java
        if: runner.os == 'Windows'
        run: python ops/verify-local-memory.py --bundle target/vortex-local-windows-x64.zip --bundled-runtime --distractors 0 --mcp --output target/local-bundle-smoke.json
      - name: Upload verified Windows assets
        if: success() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vortex-local-windows-release
          compression-level: 0
          if-no-files-found: error
          path: |
            target/vortex-local-windows-x64.zip
            target/vortex-local-windows-x64.zip.sha256
            target/OpenJDK21U-jdk-sources_*.tar.gz
            target/OpenJDK21U-jdk-sources_*.tar.gz.sha256
      - name: Upload verified universal trial bundle
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vortex-local-ubuntu-latest
          compression-level: 0
          if-no-files-found: error
          path: |
            target/vortex-local-alpha.zip
            target/vortex-local-alpha.zip.sha256
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-local-evidence-${{ matrix.os }}
          path: |
            target/local-memory-smoke.json
            target/local-bundle-smoke.json
            target/local-memory-smoke-*/server-*.log
            **/target/surefire-reports/*.txt
          if-no-files-found: warn
