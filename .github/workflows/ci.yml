name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit tests and package verification
        run: mvn -B verify

      - name: Isolated app integration verify
        shell: pwsh
        run: ./ops/run-integration-tests.ps1

      - name: Baseline governance check
        shell: pwsh
        run: ./ops/run-baseline-governance-check.ps1 -SkipMavenTest -SkipPackage

      - name: Learning governance check
        shell: pwsh
        run: ./ops/run-learning-governance-check.ps1 -SkipMavenTest -SkipPackage -SkipLearningRun
