name: ${COMPOSE_PROJECT_NAME:-vortex-it}

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    labels:
      com.vortex.test.run-id: ${VORTEX_IT_RUN_ID:?Set VORTEX_IT_RUN_ID}
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-07-04T14-25-45Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${VORTEX_IT_MINIO_USER:?Set VORTEX_IT_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${VORTEX_IT_MINIO_PASSWORD:?Set VORTEX_IT_MINIO_PASSWORD}
    labels:
      com.vortex.test.run-id: ${VORTEX_IT_RUN_ID:?Set VORTEX_IT_RUN_ID}
    ports:
      - "127.0.0.1::9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  milvus:
    image: milvusdb/milvus:v2.4.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${VORTEX_IT_MINIO_USER:?Set VORTEX_IT_MINIO_USER}
      MINIO_SECRET_ACCESS_KEY: ${VORTEX_IT_MINIO_PASSWORD:?Set VORTEX_IT_MINIO_PASSWORD}
    labels:
      com.vortex.test.run-id: ${VORTEX_IT_RUN_ID:?Set VORTEX_IT_RUN_ID}
    ports:
      - "127.0.0.1::19530"
      - "127.0.0.1::9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 5s
      retries: 60
